<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admission Form - S.D. College of Management Studies</title> 
    <link rel="stylesheet" href="addmissionstyle.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <img src="images/logo.png" alt="College Logo">
        <h1>Admission Form</h1>
    </div>

    <!-- Content -->
    <div class="content">
        <h2>Fill in Your Details</h2>
        <div class="admission-form">
            <form action="submit_form.php" method="post" enctype="multipart/form-data">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
                
                <label for="email">Email (Please enter a valid Email address):</label>
                <input type="email" id="email" name="email" required>
                
                <label for="phone">Phone Number (Please enter a valid Contact number):</label>
                <input type="tel" id="phone" name="phone" required>
                
                <label for="address">Correspondence Address (optional):</label>
                <textarea id="address" name="address" optional></textarea>
                
                <label for="permanent_address">Permanent Address:</label>
                <textarea id="permanent_address" name="permanent_address" required></textarea>
                
                <label for="program">Preferred Program:</label>
                <select id="program" name="program" required>
                    <!-- Your options here -->
                </select>

                <label for="photo">Upload Photo:</label>
                <input type="file" id="photo" name="photo" accept="image/*" required>
                
                <button type="submit">Submit Application</button>
            </form>
        </div>
    </div>
